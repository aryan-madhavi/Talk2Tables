services:
  # ── MongoDB: User & Chat Storage ──────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: t2t-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ── Redis: Session & Schema Cache ─────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: t2t-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data:
